[package]
name    = "vinoopeneffects-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "vinoopeneffects-daemon"
path = "src/main.rs"

[features]
# Opt-in OpenVINO execution provider (NPU/GPU). Switches ONNX Runtime from the
# bundled CPU download to loading the library named by ORT_DYLIB_PATH.
npu = ["ort/load-dynamic", "ort/openvino"]

[dependencies]
shared = { package = "vinoopeneffects-shared", path = "../shared" }

anyhow.workspace    = true
thiserror.workspace = true
tokio.workspace     = true
zbus.workspace      = true
zvariant.workspace  = true
serde.workspace = true
toml.workspace  = true
dirs.workspace  = true
tracing.workspace            = true
tracing-subscriber.workspace = true

gstreamer.workspace       = true
gstreamer-video.workspace = true
gstreamer-app.workspace   = true
gstreamer-base.workspace  = true

# v0_3_34 enables pw_stream_trigger_process (driving the virtual source cadence).
pipewire = { workspace = true, features = ["v0_3_34"] }

ort.workspace   = true
sha2.workspace  = true
image.workspace = true

libc.workspace  = true

[build-dependencies]
zbus        = { version = "5", features = ["tokio"] }
zbus_xmlgen = "5"
zbus_xml    = "5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
