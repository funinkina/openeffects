name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - &apt
        name: Install system dependencies
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo -E apt-get $apt_opts install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - &cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *apt
      - *cache
      # Model-backed tests no-op without models (see core inference/models.rs).
      - run: cargo test --workspace

  # Core is pure logic, so this job installs no GStreamer, GTK or PipeWire.
  # Clients reach the daemon only over D-Bus, so they must never link core or
  # the daemon (that would pull ONNX Runtime into the GUI and CLI).
  core:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *cache
      - name: Check crate boundaries
        run: |
          if cargo tree -p vinoopeneffects-core -e normal --prefix none \
              | grep -E "^(gstreamer|gtk4|libadwaita|pipewire)"; then
            echo "core must not link a media or GUI stack"; exit 1
          fi
          for client in vinoopeneffects vinoopeneffects-ctl; do
            if cargo tree -p "$client" -e normal --prefix none \
                | grep -E "^vinoopeneffects-(core|daemon) "; then
              echo "$client must depend on shared only, not core or daemon"; exit 1
            fi
          done
      - run: cargo test -p vinoopeneffects-core

  build-npu:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *apt
      - *cache
      # Default features are the NPU build (load-dynamic, no ONNX Runtime at
      # build time); the opt-out is the statically linked CPU-only build.
      - run: cargo check -p vinoopeneffects-daemon
      - run: cargo check -p vinoopeneffects-daemon --no-default-features

  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-version in Cargo.toml.
      - run: rustup toolchain install 1.92 --profile minimal
      - *apt
      - *cache
      - run: cargo +1.92 check --workspace

  # scripts/install.sh is the documented source install; this keeps it honest.
  install:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *apt
      - *cache
      - run: shellcheck scripts/install.sh scripts/uninstall.sh
      - name: Install into a scratch prefix, then remove it
        run: |
          prefix="$RUNNER_TEMP/prefix"
          scripts/install.sh --prefix "$prefix" --no-models
          id=io.github.karanshukla.vinoopeneffects
          for f in bin/vinoopeneffects-daemon bin/vinoopeneffects-ctl bin/vinoopeneffects \
              share/dbus-1/services/$id.Daemon.service \
              share/dbus-1/interfaces/$id.Daemon1.xml \
              share/systemd/user/vinoopeneffects-daemon.service \
              share/applications/$id.desktop \
              share/icons/hicolor/scalable/apps/$id.svg; do
            test -e "$prefix/$f" || { echo "missing: $f"; exit 1; }
          done
          grep -qx "Exec=$prefix/bin/vinoopeneffects-daemon" "$prefix/share/dbus-1/services/$id.Daemon.service"
          scripts/uninstall.sh --prefix "$prefix"
          leftover="$(find "$prefix" -type f)"
          test -z "$leftover" || { echo "left behind:"; echo "$leftover"; exit 1; }

  deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Fedora is the dev and packaging target. This builds with Fedora's own rustc
  # and packaged GTK4, libadwaita, GStreamer and PipeWire, as an RPM build would.
  # Not a required check: a new Fedora release can break it independently of a PR.
  fedora:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: fedora:latest
    steps:
      - name: Install toolchain and dev libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo gcc pkgconf-pkg-config clang-devel git \
            gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-bad-free-devel \
            gtk4-devel libadwaita-devel pipewire-devel \
            gstreamer1-plugins-base gstreamer1-plugins-good
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: rustc --version
      # --locked: build against exactly the committed Cargo.lock, as a packager does.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
