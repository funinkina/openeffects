name: Models

# Real ONNX Runtime inference against the models in data/models. Kept out of
# ci.yml so a model-host outage (GitHub raw, Hugging Face) can never block an
# unrelated PR, and is not a required check. Normal CI only proves compile and
# logic: the model-backed tests there no-op when no models are installed.

on:
  pull_request:
    paths:
      - "data/models/**"
      - "scripts/fetch-models.sh"
      - "scripts/fetch-ort.sh"
      - "daemon/src/inference/**"
      - ".github/workflows/models.yml"
  push:
    branches: [main]
    paths:
      - "data/models/**"
      - "scripts/fetch-models.sh"
      - "scripts/fetch-ort.sh"
      - "daemon/src/inference/**"
      - ".github/workflows/models.yml"
  # Weekly, with the cache bypassed, so a moved or changed upstream file shows up
  # here rather than on a contributor's first fetch.
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: models-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  models:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install stable --profile minimal

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo -E apt-get $apt_opts install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      # The daemon looks in $XDG_DATA_HOME/vinoopeneffects/models and
      # $XDG_DATA_HOME/vinoopeneffects/ort. Point both at the runner temp dir.
      - name: Point data directories at the runner temp dir
        run: |
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "ORT_DYLIB_PATH=$RUNNER_TEMP/xdg/vinoopeneffects/ort/libonnxruntime.so" >> "$GITHUB_ENV"

      # Keyed on everything the fetch depends on. Restore-only on pull requests
      # (including forks); only main and the schedule write the cache.
      - name: Restore cached models
        id: cache-models
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/xdg/vinoopeneffects/models
          key: models-${{ hashFiles('data/models/*/manifest.toml', 'scripts/fetch-models.sh') }}

      - name: Restore cached onnxruntime
        id: cache-ort
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/xdg/vinoopeneffects/ort
          key: ort-${{ hashFiles('scripts/fetch-ort.sh') }}

      # Idempotent and sha256-verified, so a cache hit costs only the hashing and
      # a corrupt or partial cache is repaired rather than trusted.
      - name: Fetch models
        run: scripts/fetch-models.sh

      # onnxruntime shared library is loaded dynamically at runtime; fetch-ort.sh
      # installs the CPU build so the tests can execute inference on the models.
      - name: Fetch onnxruntime
        run: scripts/fetch-ort.sh "$RUNNER_TEMP/xdg/vinoopeneffects/ort"

      - name: Save models to the cache
        if: github.event_name != 'pull_request' && steps.cache-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/xdg/vinoopeneffects/models
          key: models-${{ hashFiles('data/models/*/manifest.toml', 'scripts/fetch-models.sh') }}

      - name: Save onnxruntime to the cache
        if: github.event_name != 'pull_request' && steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/xdg/vinoopeneffects/ort
          key: ort-${{ hashFiles('scripts/fetch-ort.sh') }}

      # The tests print "skipping: <model> model not installed" or "skipping: onnxruntime not available"
      # and pass, so a green run alone would not prove inference ran. Fail if any of them skipped.
      - name: Test with real models
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -q -E 'model not installed|onnxruntime not available' "$RUNNER_TEMP/test.log"; then
            echo "::error::a model-backed test skipped even though models and runtime were fetched"
            grep -E 'model not installed|onnxruntime not available' "$RUNNER_TEMP/test.log"
            exit 1
          fi
