[workspace]
resolver = "3"
members = ["shared", "daemon", "cli", "gui", "tests/integration"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Aryan <hello@funinkina.co.in>"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"

serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
dirs = "6.0.0"

tokio = { version = "1.52.3", features = ["full"] }

zbus = { version = "5", features = ["tokio"] }
zvariant = "5"

gstreamer = "0.25.2"
gstreamer-video = "0.25.2"
gstreamer-app = "0.25.2"
gstreamer-gl = "0.25.2"
gstreamer-base = "0.25.2"

pipewire = "0.10"

ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "download-binaries",
    "tls-rustls",
    "std",
] }
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }

tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

clap = { version = "4", features = ["derive"] }
futures-util = "0.3.32"

# xdg-desktop-portal client (Camera + Background portals). Only exercised inside
# the Flatpak sandbox (gated on FLATPAK_ID); dormant on native installs.
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
