# cargo-deny policy. Project is GPL-3.0-or-later, so any GPL-compatible
# permissive license is fine.

[graph]
all-features = false

[advisories]
version = 2
# quick-xml 0.39 is pinned by zbus_xml, which is a build-dependency that only
# parses the repo's own D-Bus introspection XML at compile time, never untrusted
# input. Drop these once zbus_xml moves to quick-xml >= 0.41.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "build-time parse of trusted in-repo XML" },
    { id = "RUSTSEC-2026-0195", reason = "build-time parse of trusted in-repo XML" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
